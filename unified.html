<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Copilot</title>
    <link href="./dist/output.css" rel="stylesheet" />
    <link href="./src/styles/common.css" rel="stylesheet" />
    <!-- marked is a full CommonMark parser; lib/markdown.js is the legacy
         fallback (it mis-renders lists that follow a paragraph directly). -->
    <script src="lib/marked.min.js"></script>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <style>
      :root {
        --bg: rgba(18, 18, 20, 0.82);
        --bg-solid: rgba(24, 24, 27, 0.96);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --text-dim: rgba(255, 255, 255, 0.55);
        --accent: #6366f1;
        --accent-soft: rgba(99, 102, 241, 0.18);
        --danger: #f87171;
        --live: #34d399;
        --radius: 14px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        font-size: 13px;
        overflow: hidden;
        user-select: none;
      }

      .shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        gap: 8px;
        padding: 8px;
      }

      /* ---------- Top bar (the always-visible pill) ---------- */
      .bar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 8px;
        background: var(--bg);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        -webkit-app-region: drag;
        flex-shrink: 0;
      }

      .grip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 2px;
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-dim);
        flex-shrink: 0;
        transition: background 0.25s ease, box-shadow 0.25s ease;
      }
      .status-dot.live {
        background: var(--live);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      .divider {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 3px;
        flex-shrink: 0;
      }

      .btn {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.1); }
      .btn:active { transform: translateY(0.5px); }
      .btn.icon-only { padding: 0 8px; }
      .btn.primary { background: var(--accent); color: #fff; }
      .btn.primary:hover { background: #4f46e5; }
      .btn.active { background: var(--accent-soft); color: #c7d2fe; }
      .btn.danger { color: var(--danger); }
      .btn.danger:hover { background: rgba(248, 113, 113, 0.14); }
      .btn .kbd {
        font-size: 10px;
        opacity: 0.6;
        font-weight: 600;
      }

      .spacer { flex: 1; }

      /* Live mic input level — visible proof audio is reaching the app,
         separate from whether Whisper transcribes it as words. Deliberately
         loud/obvious: a hairline bar is too easy to miss when the question is
         literally "is anything happening at all". */
      .mic-meter-wrap {
        -webkit-app-region: no-drag;
        display: none;
        align-items: center;
        gap: 6px;
      }
      .mic-meter-wrap.show { display: flex; }
      .mic-meter {
        width: 64px;
        height: 12px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--border);
        overflow: hidden;
        flex-shrink: 0;
      }
      .mic-meter-fill {
        height: 100%;
        width: 0%;
        background: var(--live);
        transition: width 0.06s linear;
      }
      .mic-meter-fill.hot { background: #fbbf24; }
      .mic-meter-pct {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-dim);
        min-width: 28px;
      }

      /* ---------- Response / chat panel ---------- */
      .panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-solid);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .panel.hidden { display: none; }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        flex-shrink: 0;
      }
      .panel-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }
      .badge {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: #c7d2fe;
      }
      .badge.auto {
        background: rgba(52, 211, 153, 0.16);
        color: #6ee7b7;
      }

      .feed {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        user-select: text;
        -webkit-app-region: no-drag;
      }
      .feed::-webkit-scrollbar { width: 8px; }
      .feed::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 4px;
      }
      .feed::-webkit-scrollbar-track { background: transparent; }

      .msg {
        border-radius: 10px;
        padding: 10px 12px;
        line-height: 1.55;
        font-size: 13px;
        animation: rise 0.18s ease;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      .msg.user {
        align-self: flex-end;
        max-width: 82%;
        background: var(--accent);
        color: #fff;
      }
      .msg.ai {
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .msg.heard {
        background: transparent;
        border-left: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 0;
        padding: 2px 0 2px 10px;
        color: var(--text-dim);
        font-size: 12px;
        font-style: italic;
      }
      .msg.system {
        text-align: center;
        color: var(--text-dim);
        font-size: 11.5px;
        padding: 4px;
      }

      /* Minutes of Meeting card shown when a session ends */
      .msg.mom {
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(99, 102, 241, 0.35);
      }
      .mom-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .mom-body {
        max-height: 260px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .mom-body::-webkit-scrollbar { width: 6px; }
      .mom-body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 3px;
      }

      .msg-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
      }
      .msg-meta .tag {
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .msg-meta .tag.auto { background: rgba(52, 211, 153, 0.18); color: #6ee7b7; }
      .msg-meta .tag.screen { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }

      .msg.ai p { margin: 0 0 8px; }
      .msg.ai p:last-child { margin-bottom: 0; }
      .msg.ai ul, .msg.ai ol { margin: 0 0 8px; padding-left: 18px; }
      .msg.ai li { margin-bottom: 3px; }
      .msg.ai code {
        background: rgba(255, 255, 255, 0.1);
        padding: 1px 5px;
        border-radius: 4px;
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        font-size: 12px;
      }
      .msg.ai pre {
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 0 0 8px;
      }
      .msg.ai pre code { background: none; padding: 0; }
      .msg.ai strong { color: #fff; }
      .msg.ai table {
        width: 100%;
        border-collapse: collapse;
        margin: 0 0 8px;
        font-size: 12px;
        display: block;
        overflow-x: auto;
      }
      .msg.ai th, .msg.ai td {
        border: 1px solid var(--border);
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      .msg.ai th {
        background: rgba(255, 255, 255, 0.06);
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }
      .msg.ai blockquote {
        margin: 0 0 8px;
        padding-left: 10px;
        border-left: 2px solid var(--border);
        color: var(--text-dim);
      }
      .msg.ai hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 10px 0;
      }
      .msg.ai h1, .msg.ai h2, .msg.ai h3 {
        font-size: 13px;
        margin: 10px 0 6px;
        color: #fff;
      }

      .empty {
        margin: auto;
        text-align: center;
        color: var(--text-dim);
        font-size: 12px;
        line-height: 1.7;
        padding: 20px;
      }
      .empty .big { font-size: 22px; margin-bottom: 8px; opacity: 0.5; }

      .typing { display: inline-flex; gap: 3px; align-items: center; }
      .typing i {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--text-dim);
        animation: blink 1.3s infinite;
      }
      .typing i:nth-child(2) { animation-delay: 0.18s; }
      .typing i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes blink {
        0%, 60%, 100% { opacity: 0.25; }
        30% { opacity: 1; }
      }

      /* ---------- Composer ---------- */
      .composer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }
      .composer input {
        flex: 1;
        height: 32px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        outline: none;
        user-select: text;
      }
      .composer input:focus {
        border-color: rgba(99, 102, 241, 0.65);
        background: rgba(255, 255, 255, 0.08);
      }
      .composer input::placeholder { color: rgba(255, 255, 255, 0.35); }
    </style>
  </head>
  <body>
    <div class="shell">
      <!-- Always-visible control bar -->
      <div class="bar" id="bar">
        <div class="grip">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Idle</span>
        </div>

        <div class="divider"></div>

        <button class="btn" id="micBtn" title="Toggle listening (Alt+R)">
          <i class="fas fa-microphone"></i>
          <span>Listen</span>
        </button>
        <div class="mic-meter-wrap" id="micMeter" title="Microphone input level — proves your voice is reaching the app">
          <div class="mic-meter">
            <div class="mic-meter-fill" id="micMeterFill"></div>
          </div>
          <span class="mic-meter-pct" id="micMeterPct">0%</span>
        </div>

        <button class="btn" id="askBtn" title="Ask AI for help now">
          <i class="fas fa-wand-magic-sparkles"></i>
          <span>Ask AI</span>
        </button>

        <button class="btn" id="autoBtn" title="Continuously watch the screen and answer automatically">
          <i class="fas fa-eye"></i>
          <span>Auto</span>
        </button>

        <button class="btn icon-only" id="shotBtn" title="Capture screen and analyze (⌘⇧S)">
          <i class="fas fa-camera"></i>
        </button>

        <div class="spacer"></div>

        <button class="btn icon-only" id="togglePanelBtn" title="Show/hide panel">
          <i class="fas fa-chevron-up" id="toggleIcon"></i>
        </button>
        <button class="btn icon-only" id="momBtn" title="Generate Minutes of Meeting">
          <i class="fas fa-file-lines"></i>
        </button>
        <button class="btn icon-only" id="settingsBtn" title="Settings (⌘,)">
          <i class="fas fa-gear"></i>
        </button>
        <button class="btn icon-only danger" id="endBtn" title="End session">
          <i class="fas fa-power-off"></i>
        </button>
      </div>

      <!-- One panel for everything: answers, transcript, chat -->
      <div class="panel" id="panel">
        <div class="panel-head">
          <span class="panel-title">Assistant</span>
          <span class="badge" id="skillBadge">Meeting</span>
          <span class="badge auto" id="autoBadge" style="display: none;">Auto-watching</span>
          <div class="spacer"></div>
          <button class="btn icon-only" id="clearBtn" title="Clear">
            <i class="fas fa-eraser"></i>
          </button>
        </div>

        <div class="feed" id="feed">
          <div class="empty" id="empty">
            <div class="big"><i class="fas fa-headset"></i></div>
            Listening for the meeting.<br />
            Answers appear here automatically.
          </div>
        </div>

        <div class="composer">
          <input id="input" type="text" placeholder="Ask anything…" autocomplete="off" />
          <button class="btn primary" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <script src="./src/ui/unified-window.js"></script>
  </body>
</html>
