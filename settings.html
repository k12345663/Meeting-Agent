<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="./src/styles/common.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .settings-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.3) 0%, rgba(20, 20, 20, 0.4) 100%);
            backdrop-filter: blur(25px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        .settings-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-app-region: drag;
            flex-shrink: 0;
        }

        .header-title {
            color: rgba(255, 255, 255, 0.95);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn.btn-quit {
            background: rgba(255, 71, 87, 0.8);
        }

        .btn.btn-quit:hover {
            background: rgba(255, 71, 87, 1);
        }

        .settings-content {
            flex: 1;
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 14px 16px;
        }

        .settings-item-label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
        }

        .settings-item-description {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .switch-track {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .switch-track::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .switch input:checked + .switch-track {
            background: rgba(99, 102, 241, 0.9);
        }

        .switch input:checked + .switch-track::before {
            transform: translateX(18px);
        }

        .settings-note {
            margin-top: 14px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="settings-header">
            <div class="header-title">
                <i class="fas fa-cog"></i>
                Settings
            </div>
            <div class="header-actions">
                <button class="btn btn-quit" id="quitButton">
                    <i class="fas fa-power-off"></i>
                    Quit
                </button>
                <button class="btn" id="closeButton">
                    <i class="fas fa-times"></i>
                    Close
                </button>
            </div>
        </div>

        <div class="settings-content">
            <div class="settings-item">
                <div>
                    <div class="settings-item-label">Continuous Monitoring</div>
                    <div class="settings-item-description">Watch the screen and answer automatically without asking each time</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="continuousMonitoringToggle">
                    <span class="switch-track"></span>
                </label>
            </div>
            <div class="settings-note">
                Everything else — API keys, feature access, speech provider — is managed centrally by your admin.
            </div>
        </div>
    </div>

    <script src="./src/ui/settings-window.js"></script>
</body>
</html>
