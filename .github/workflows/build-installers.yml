name: Build installers

# Builds the Mac DMG on a real macOS runner and the Windows exe on a real
# Windows runner — no Wine, no cross-compilation guesswork. A Mac can build
# its own DMG locally fine (already done), but building a genuine, reliable
# Windows .exe requires either a real Windows machine or this: GitHub's
# hosted Windows runners, free for this kind of use.
#
# Triggers on version tags (e.g. v1.0.1) and can also be run manually from
# the Actions tab for a test build without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner — matches this project's dev machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build DMG
        run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            dist/*.dmg
            dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build exe
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
